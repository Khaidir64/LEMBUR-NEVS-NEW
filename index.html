<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Lembur Karyawan - Nevs</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --admin-color: #7c3aed;
            --admin-hover: #6d28d9;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --bg-image: url('BG NEVS.png'); 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #f8fafc;
            color: var(--text-color); 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        
        .container { width: 100%; max-width: 800px; }
        .nav-mode { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 15px; width: 100%; }
        .btn-mode { flex: 1; padding: 14px 10px; border: 1px solid var(--border-color); background: #fff; cursor: pointer; border-radius: 10px; font-size: 14px; font-weight: bold; color: #64748b; text-align: center; }
        .btn-mode.active-user { background: var(--primary-color); color: white; border-color: var(--primary-color); }
        .btn-mode.active-admin { background: var(--admin-color); color: white; border-color: var(--admin-color); }

        header { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border-color); display: flex; flex-direction: column-reverse; align-items: center; gap: 10px; text-align: center; backdrop-filter: blur(5px); }
        .header-text h1 { color: var(--primary-color); font-size: 18px; margin-bottom: 4px; font-weight: 700; }
        .admin-mode .header-text h1 { color: var(--admin-color); }
        .header-text p { color: #64748b; font-size: 12px; }
        .brand-logo { max-height: 50px; max-width: 140px; object-fit: contain; }

        .view-section { display: none; }
        .view-section.active { display: block; }
        .card { background: var(--card-bg); padding: 14px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; margin-bottom: 15px; backdrop-filter: blur(5px); }
        .card h2 { font-size: 15px; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid var(--border-color); }

        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #475569; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; outline: none; background: #fff; }
        button.btn-submit { width: 100%; padding: 14px; background-color: var(--primary-color); color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
        
        .table-container { overflow-x: auto; width: 100%; border: 1px solid var(--border-color); border-radius: 8px; background: #fff; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
        td.keterangan-cell { white-space: normal; min-width: 150px; max-width: 250px; word-wrap: break-word; }
        th { background-color: #f1f5f9; color: #475569; font-weight: 600; }
        
        .btn-export { background-color: #16a34a; padding: 10px 16px; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-hapus { background-color: #ef4444; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .no-data { text-align: center; color: #94a3b8; padding: 15px; font-style: italic; font-size: 13px; }
        .loading-status { font-size: 13px; color: #2563eb; font-weight: 600; text-align: center; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="nav-mode">
        <button class="btn-mode active-user" id="btnUser" onclick="switchMode('user')">KARYAWAN</button>
        <button class="btn-mode" id="btnAdmin" onclick="switchMode('admin')">ADMIN</button>
    </div>

    <header>
        <div class="header-text">
            <h1 id="mainTitle">Sistem Pencatatan Lembur Nevs Banjarmasin</h1>
        </div>
    </header>

    <div id="userSection" class="view-section active">
        </div>

    <div id="adminSection" class="view-section">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2>Panel Kontrol Admin</h2>
                <button class="btn-export" onclick="exportToCSV()">Unduh Excel</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama</th>
                            <th>Pekerjaan</th>
                            <th>Tanggal</th>
                            <th>Masuk</th>
                            <th>Pulang</th>
                            <th>Durasi</th>
                            <th>Tugas</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwpHGS0eEHYVpkKBL9eTlIQY2t0ddHpp_Z_z6xnNukFbvHc8BCSlhqxhL0TfQCjtaY3/exec"; 
    let dataLembur = [];

    // Fungsi Hapus Data
    function hapusData(index) {
        if(!confirm("Yakin ingin menghapus data ini?")) return;
        
        fetch(`${SCRIPT_URL}?action=delete&rowIndex=${index}`, { method: 'POST' })
        .then(() => {
            alert("Data berhasil dihapus!");
            muatDataDariPusat();
        })
        .catch(e => alert("Gagal menghapus: " + e));
    }

    // Update fungsi tampilkanDataAdmin agar memunculkan tombol hapus
    function tampilkanDataAdmin() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        dataLembur.forEach((item, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td><b>${item.nama}</b></td>
                <td>${item.pekerjaan}</td>
                <td>${formatTanggal(item.tanggal)}</td>
                <td>${item.jamMasuk}</td>
                <td>${item.jamPulang}</td>
                <td>${item.durasi}</td>
                <td class="keterangan-cell">${item.keterangan || '-'}</td>
                <td><button class="btn-hapus" onclick="hapusData(${index})">Hapus</button></td>
            `;
            tbody.appendChild(row);
        });
    }

    // ... (Fungsi lainnya seperti muatDataDariPusat, switchMode, dll tetap di sini) ...
</script>
</body>
</html>
