<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Lembur Karyawan - Nevs</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --admin-color: #7c3aed;
            --card-bg: rgba(255, 255, 255, 0.95);
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f8fafc; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; }
        .nav-mode { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn-mode { flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; color: #64748b; background: #fff; border: 1px solid var(--border-color); }
        .btn-mode.active-user { background: var(--primary-color); color: white; }
        .btn-mode.active-admin { background: var(--admin-color); color: white; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; }
        button.btn-submit { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { padding: 10px; border: 1px solid var(--border-color); }
        .btn-hapus { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-mode">
        <button class="btn-mode active-user" id="btnUser" onclick="switchMode('user')">KARYAWAN</button>
        <button class="btn-mode" id="btnAdmin" onclick="switchMode('admin')">ADMIN</button>
    </div>

    <div id="userSection" class="view-section active">
        <div class="card">
            <h2>Form Input Lembur</h2>
            <form id="overtimeForm">
                <div class="form-group"><input type="text" id="nama" placeholder="Nama Karyawan" required></div>
                <div class="form-group"><input type="text" id="pekerjaan" placeholder="Pekerjaan" required></div>
                <div class="form-group"><input type="date" id="tanggal" required></div>
                <div class="form-group"><input type="time" id="jamMasuk" required></div>
                <div class="form-group"><input type="time" id="jamPulang" required></div>
                <div class="form-group"><textarea id="keterangan" placeholder="Keterangan"></textarea></div>
                <button type="submit" class="btn-submit">Kirim Data</button>
            </form>
        </div>
    </div>

    <div id="adminSection" class="view-section">
        <div class="card">
            <h2>Panel Admin</h2>
            <table>
                <thead>
                    <tr><th>Nama</th><th>Tugas</th><th>Aksi</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwpHGS0eEHYVpkKBL9eTlIQY2t0ddHpp_Z_z6xnNukFbvHc8BCSlhqxhL0TfQCjtaY3/exec";

    // 1. Fungsi Switch Tab
    function switchMode(mode) {
        document.getElementById('userSection').classList.toggle('active', mode === 'user');
        document.getElementById('adminSection').classList.toggle('active', mode === 'admin');
        if(mode === 'admin') muatData();
    }

    // 2. Muat Data
    function muatData() {
        fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach((item, index) => {
                tbody.innerHTML += `<tr><td>${item.nama}</td><td>${item.keterangan}</td>
                <td><button class="btn-hapus" onclick="hapusData(${index})">Hapus</button></td></tr>`;
            });
        });
    }

    // 3. Hapus Data
    function hapusData(index) {
        if(!confirm("Yakin hapus data ini?")) return;
        fetch(`${SCRIPT_URL}?action=delete&rowIndex=${index}`, {method: 'POST'})
        .then(() => muatData());
    }

    // 4. Submit Form
    document.getElementById('overtimeForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const data = new FormData(e.target);
        fetch(SCRIPT_URL, {method: 'POST', body: data})
        .then(() => alert("Data Terkirim!"));
    });
</script>
</body>
</html>
